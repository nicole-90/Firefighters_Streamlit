<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brigitte or Burger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Phone-first survey: each question = scale (decides team) + "which cat?" guess (Best Instincts). No server; result sent by WhatsApp. */
:root{
  --bg:#F3F4F6; --paper:#FFFFFF; --ink:#141518; --muted:#62656D; --line:#D9DCE2;
  --white-cat:#FFFFFF; --black-cat:#141518; --nose:#D45F75; --nose-soft:#FBE7EB; --ok:#2F7D5B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --paper:#1A1B1F; --ink:#EDEEF0; --muted:#A0A3AB; --line:#2E3036;
  --nose:#F08FA1; --nose-soft:#3A2228; --ok:#6FCB9F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1013; --paper:#1A1B1F; --ink:#EDEEF0; --muted:#A0A3AB; --line:#2E3036;
  --nose:#F08FA1; --nose-soft:#3A2228; --ok:#6FCB9F; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;border:2px solid var(--black-cat)}
.hero div{padding:18px 12px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.hero .bu{background:var(--black-cat);color:var(--white-cat)}
.hero .br{background:var(--white-cat);color:var(--black-cat)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.08;margin:0;text-wrap:balance;text-align:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--nose);outline-offset:2px}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:14px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-align:center;text-decoration:none;display:block;width:100%}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.progress{display:flex;gap:5px}
.progress span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.progress span.on{background:var(--nose)}
.qn{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.ans{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:16px}
.ans b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{padding:14px 0;font-family:var(--display);font-size:20px;background:var(--nose-soft);color:var(--ink);border-color:var(--nose)}
.scale button.sel{background:var(--nose);color:#fff}
.scalelab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-8px}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guess button.bu{background:var(--black-cat);color:#fff;border-color:var(--black-cat)}
.guess button.br{background:#fff;color:#141518;border-color:#141518}
.guess button.sel{outline:4px solid var(--nose);outline-offset:2px}
.sub{font-weight:700}
.result{text-align:center;align-items:center}
.team{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;padding:24px 16px;border-radius:16px;width:100%;border:2px solid var(--black-cat)}
.team.bu{background:var(--black-cat);color:#fff}
.team.br{background:#fff;color:#141518}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;text-align:center;margin:0}
.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
</style>
</head><body>

<div class="wrap" id="app"></div>

<script>
const SMS = "+61478709207";
// brig = the Brigitte answer; other = the Burger answer; cat = the "which cat" follow-up and its true answer
const QUESTIONS = [
 {q:"Your last trip to A&E was…", brig:"Routine.", other:"The party got out of hand…",
  cat:"Which cat played with a string, swallowed it and needed surgery?", truth:"Burger"},
 {q:"Your perfect Saturday afternoon is…", brig:"Something gentle. Sorting my marble collection by colour, with a cup of tea.", other:"Jungle paintball. Camo face paint, no prisoners, bodies everywhere.",
  cat:"Which cat has a penchant for carcasses?", truth:"Burger"},
 {q:"How often do your loved ones have to come to the rescue?", brig:"Never. I know my limits.", other:"Regularly. Bailed out of a cell, stuck up a tree, head wedged in the banisters.",
  cat:"Which cat regularly gets stuck up a tree, in a garage, or behind the walls of the house?", truth:"Burger"},
 {q:"Your bedtime routine is…", brig:"Ninety minutes, six products, a full-length mirror, and not one hair out of place.", other:"Shake off the day's mud and cobwebs, and collapse.",
  cat:"Which cat spends hours grooming every evening?", truth:"Brigitte"},
 {q:"When you head out, you…", brig:"Go far and wide. The more places I'm seen, the better.", other:"Never stray far. Family first, home in time for dinner.",
  cat:"Which cat gets spotted all over the neighbourhood?", truth:"Brigitte"},
 {q:"A bird lands in your garden. Your foreign policy is…", brig:"Switzerland. Strictly neutral. The bird is a titillating thought experiment, nothing more.", other:"Russia. Everyone picks a side, and it's anarchy every time you leave the house.",
  cat:"Which cat watches the birds but never touches one?", truth:"Brigitte"},
 {q:"A small child grabs your hair. You…", brig:"Go limp and let it happen. Peace at any price.", other:"Shots fired.",
  cat:"Which cat lies still while Iris pulls its fur?", truth:"Brigitte"},
 {q:"The morning after the work Christmas party, you…", brig:"Feel great. You left at nine.", other:"Are limping, and you don't know why, and you're not asking.",
  cat:"Which cat regularly comes home limping from overdoing it?", truth:"Burger"},
 {q:"You get 15 minutes of daily one-on-one time with your closest ally. You use it to…", brig:"Get up to mischief with your partner in crime.", other:"Top up your bank of cuddles.",
  cat:"Which cat needs one-on-one playtime daily to maintain a healthy bond?", truth:"Brigitte"}
];
const N = QUESTIONS.length;
const KEY = "bb-survey-v2";
let S = load() || fresh();
function fresh(){return {name:"", step:-1, flip:QUESTIONS.map(()=>Math.random()<.5), scale:[], guess:[], tie:Math.random()<.5};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.flip&&s.flip.length===N?s:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app = document.getElementById("app");
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function brigPoints(i){ // 1..5, 5 = fully Brigitte
  const v=S.scale[i]; return S.flip[i] ? v : 6-v; // flip: Brigitte answer shown second (5 end)
}
function results(){
  let b=0; for(let i=0;i<N;i++) b+=brigPoints(i);
  const mid=N*3; const team = b>mid ? "Brigitte" : b<mid ? "Burger" : (S.tie?"Brigitte":"Burger");
  const inst = S.guess.filter((g,i)=>g===QUESTIONS[i].truth).length;
  return {b, team, inst};
}

function render(){
  if(S.step<0) return start();
  if(S.step>=N) return done();
  const i=S.step, Q=QUESTIONS[i];
  const first = S.flip[i] ? Q.other : Q.brig, second = S.flip[i] ? Q.brig : Q.other;
  const sv=S.scale[i], gv=S.guess[i];
  app.innerHTML = `
    <div class="progress">${QUESTIONS.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>
    <div class="card">
      <div class="qn">Question ${i+1} of ${N}</div>
      <p class="q">${esc(Q.q)}</p>
      <div class="ans"><b>1</b>${esc(first)}</div>
      <div class="ans"><b>5</b>${esc(second)}</div>
      <div class="sub">Where are you?</div>
      <div class="scale">${[1,2,3,4,5].map(v=>`<button data-s="${v}" class="${sv===v?"sel":""}" aria-label="${v}">${v}</button>`).join("")}</div>
      <div class="scalelab"><span>Totally 1</span><span>Totally 5</span></div>
    </div>
    <div class="card">
      <div class="sub">${esc(Q.cat)}</div>
      <div class="guess">
        <button class="br ${gv==="Brigitte"?"sel":""}" data-g="Brigitte">Brigitte</button>
        <button class="bu ${gv==="Burger"?"sel":""}" data-g="Burger">Burger</button>
      </div>
    </div>
    <button id="next" ${sv&&gv?"":"disabled"}>${i===N-1?"See my team":"Next"}</button>
    ${i>0?`<button class="ghost" id="back">Back</button>`:""}`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.scale[i]=+b.dataset.s;save();render()});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.guess[i]=b.dataset.g;save();render()});
  app.querySelector("#next").onclick=()=>{S.step++;save();render();scrollTo(0,0)};
  const bk=app.querySelector("#back"); if(bk) bk.onclick=()=>{S.step--;save();render();scrollTo(0,0)};
}

function start(){
  app.innerHTML = `
    <div class="hero"><div class="br">Brigitte</div><div class="bu">Burger</div></div>
    <h1>Are you a Brigitte, or are you a Burger?</h1>
    <div class="card">
      <p style="margin:0;font-weight:700">${N} questions seal your fate.</p>
      <p style="margin:0">Submit by 3:25. Teams revealed at 3:30.</p>
      <p class="note" style="text-align:left">Kids: your family’s choice. Join a parent’s team, or take the quiz yourself.</p>
      <label class="f">Your name<input type="text" id="nm" autocomplete="given-name" value="${esc(S.name)}" placeholder="First name"></label>
      <button id="go" ${S.name.trim()?"":"disabled"}>Start</button>
    </div>
    `;
  const nm=app.querySelector("#nm"), go=app.querySelector("#go");
  nm.oninput=()=>{S.name=nm.value;save();go.disabled=!nm.value.trim()};
  go.onclick=()=>{S.step=0;save();render()};
}

function done(){
  const r=results();
  const t=new Date().toTimeString().slice(0,8);
  const line=`B&B survey · ${S.name.trim()} · B${r.b} · I${r.inst} · ${t}`;
  const href=`sms:${SMS}?&body=${encodeURIComponent(line)}`;
  app.innerHTML = `
    <div class="card result">
      <div class="qn">${esc(S.name.trim())}</div>
      <h1>Your fate is sealed.</h1>
      <a class="btn wa" href="${href}">Submit</a>
      <p class="note">Tap Submit, then press send in your messages. Teams revealed at 3:30.</p>
    </div>
    <button class="ghost" id="again">Start again (new person)</button>`;
  const ag=app.querySelector("#again");ag.onclick=()=>{if(ag.dataset.sure){S=fresh();save();render();scrollTo(0,0)}else{ag.dataset.sure=1;ag.textContent="Tap again to clear this result"}};
}

// Host view (#host): paste the WhatsApp chat, get the median split and Best Instincts
function host(){
  app.innerHTML = `
    <h1>Team split</h1>
    <div class="card">
      <p style="margin:0">Paste the survey email lines here.</p>
      <textarea id="tx" rows="8" style="font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></textarea>
      <button id="run">Split teams</button>
    </div>
    <div id="out"></div>`;
  app.querySelector("#run").onclick=()=>{
    const re=/B&B survey · (.+?) · B(\d+) · I(\d+) · (\d\d:\d\d:\d\d)/g;
    const by={}; let m; const tx=app.querySelector("#tx").value;
    while((m=re.exec(tx))){by[m[1].trim().toLowerCase()]={name:m[1].trim(),b:+m[2],i:+m[3],t:m[4]};}
    const ppl=Object.values(by);
    if(!ppl.length){app.querySelector("#out").innerHTML='<p class="note">No survey messages found.</p>';return;}
    ppl.sort((a,b)=>b.b-a.b||a.t.localeCompare(b.t));
    const half=Math.ceil(ppl.length/2);
    const br=ppl.slice(0,half), bu=ppl.slice(half);
    const best=[...ppl].sort((a,b)=>b.i-a.i||a.t.localeCompare(b.t))[0];
    const list=(arr)=>arr.map(p=>`<div>${esc(p.name)}</div>`).join("");
    app.querySelector("#out").innerHTML=`
      <div class="card result"><div class="qn">Best Instincts</div><div class="big">${esc(best.name)}</div><p class="note">${best.i}/${N} right, submitted ${best.t}</p></div>
      <div class="hero" style="align-items:start"><div class="br">Team Brigitte (${br.length})<div style="font-family:var(--body);font-weight:400;font-size:16px;margin-top:8px">${list(br)}</div></div>
      <div class="bu">Team Burger (${bu.length})<div style="font-family:var(--body);font-weight:400;font-size:16px;margin-top:8px">${list(bu)}</div></div></div>
      <p class="note">Split at the median: the more Brigitte half goes to Brigitte. ${ppl.length} people. Add the kids by hand to even the teams.</p>`;
  };
}
if(location.hash==="#host") host(); else render();
window.addEventListener("hashchange",()=>{if(location.hash==="#host") host(); else render();});
</script>
</body></html>
